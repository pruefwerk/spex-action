name: Action qualification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m pip install -r requirements-dev.txt
      - run: ruff check scripts tests && ruff format --check scripts tests
      - run: pyright
      - run: python3 -m unittest discover -s tests -v

  artifact-wiring:
    # Actual artifact storage; no receiver dispatch or credentials required.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare raw request without Spex
        id: prepare
        env:
          SPEX_ACTION_RUNTIME_WORKFLOW: fixture/runtime/.github/workflows/acceptance.yaml@fixture
          SPEX_ACTION_DEFINITION: 'opaque fixture: the receiver parses definitions'
        run: python3 scripts/transport.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: spex-request-${{ steps.prepare.outputs.request-id }}
          path: ${{ steps.prepare.outputs.request-path }}
          if-no-files-found: error
          retention-days: 3
      - uses: actions/download-artifact@v4
        with:
          name: spex-request-${{ steps.prepare.outputs.request-id }}
          path: ${{ runner.temp }}/downloaded-request
      - name: Verify uploaded envelope
        env:
          REQUEST_SHA: ${{ steps.prepare.outputs.request-sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          data = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'downloaded-request/request.json').read_bytes()
          assert hashlib.sha256(data).hexdigest() == os.environ['REQUEST_SHA']
          request = json.loads(data)
          assert request['source']['commit'] == os.environ['GITHUB_SHA']
          assert request['schema'] == 'spex.transport/v1'
          assert 'scenario_id' not in request
          PY
