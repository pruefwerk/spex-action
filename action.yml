name: Spex scenario
description: Prepare acceptance requests or dispatch them to a remote receiver.
inputs:
  execution-mode:
    description: dispatch submits and awaits a receiver; prepare uploads a request for a subsequent reusable-workflow job.
    default: dispatch
  runtime-workflow:
    description: Receiver reference as owner/repository/.github/workflows/file.yaml@ref. The action verifies the run uses the resolved commit.
    required: false
  remote-token:
    description: Existing token valid for the entire wait. Alternative to app-id and app-private-key; never packaged.
    required: false
  app-id:
    description: GitHub App ID. Provide with app-private-key instead of remote-token for automatic token renewal.
    required: false
  app-private-key:
    description: GitHub App PEM private key. The App needs Actions write and Contents read on the receiver, and Actions read on the source. Never packaged.
    required: false
  wait-timeout:
    description: Total remote wait, including queue time; bounded cancellation follows expiry.
    default: 6h
  runtime:
    description: Optional receiver runtime selector, for example migration-testbench/v1@v0.4.0. Omit for the receiver default.
    required: false
  name:
    description: Optional scenario name override.
    required: false
  description:
    description: Optional scenario description override.
    required: false
  scenario-timeout:
    description: Optional scenario execution timeout.
    required: false
  definition:
    description: One inline scenario TOML, or YAML/Gherkin tests separated by standalone --- lines. Mutually exclusive with definition-files.
    required: false
  definition-files:
    description: Definition paths or globs relative to the caller's current directory, one per line. The receiver expands them at the workflow source SHA. Mutually exclusive with definition.
    required: false
outputs:
  request-artifact-id:
    description: Uploaded request artifact ID. Pass with request-id and request-sha256 to a reusable workflow.
    value: ${{ steps.package.outputs.artifact-id }}
  scenario-id:
    description: Final canonical scenario identity returned by the receiver, when available.
    value: ${{ steps.submit.outputs.scenario-id }}
  request-path:
    description: Local raw submission envelope. It is not an executable scenario.
    value: ${{ steps.prepare.outputs.request-path }}
  request-sha256:
    description: SHA-256 of the exact submitted envelope bytes.
    value: ${{ steps.prepare.outputs.request-sha256 }}
  result-path:
    description: Local sanitized result summary JSON, when written successfully. Full test evidence stays on the receiver.
    value: ${{ steps.submit.outputs.result-path }}
  artifact-directory:
    description: Local request and result directory, when available. Detailed test evidence stays in the remote run.
    value: ${{ steps.prepare.outputs.artifact-directory }}
  runtime:
    description: Runtime identifier resolved by the receiver, when available.
    value: ${{ steps.submit.outputs.runtime }}
  runtime-release:
    description: Exact runtime implementation release selected by the receiver, when available.
    value: ${{ steps.submit.outputs.runtime-release }}
  spex-version:
    description: Exact Spex execution version reported by the receiver. This is an output, not a caller selection.
    value: ${{ steps.submit.outputs.spex-version }}
  request-id:
    description: Unique remote submission identity.
    value: ${{ steps.prepare.outputs.request-id }}
  run-url:
    description: Correlated remote workflow run, when discovered.
    value: ${{ steps.submit.outputs.run-url }}
  cancellation:
    description: Action cancellation request status (not_requested, requested, or unconfirmed), not receiver completion or cleanup status.
    value: ${{ steps.submit.outputs.cancellation }}
runs:
  using: composite
  steps:
    - name: Validate execution mode and inputs
      shell: bash
      env:
        SPEX_ACTION_EXECUTION_MODE: ${{ inputs.execution-mode }}
        SPEX_ACTION_RUNTIME_WORKFLOW: ${{ inputs.runtime-workflow }}
        SPEX_REMOTE_TOKEN: ${{ inputs.remote-token }}
        SPEX_REMOTE_APP_ID: ${{ inputs.app-id }}
        SPEX_REMOTE_APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/transport.py" validate
    - id: prepare
      name: Prepare raw submission
      shell: bash
      env:
        SPEX_ACTION_EXECUTION_MODE: ${{ inputs.execution-mode }}
        SPEX_REMOTE_TOKEN: ''
        SPEX_REMOTE_APP_ID: ''
        SPEX_REMOTE_APP_PRIVATE_KEY: ''
        SPEX_ACTION_RUNTIME_WORKFLOW: ${{ inputs.runtime-workflow }}
        SPEX_ACTION_WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
        SPEX_ACTION_RUNTIME: ${{ inputs.runtime }}
        SPEX_ACTION_NAME: ${{ inputs.name }}
        SPEX_ACTION_DESCRIPTION: ${{ inputs.description }}
        SPEX_ACTION_TIMEOUT: ${{ inputs.scenario-timeout }}
        SPEX_ACTION_DEFINITION: ${{ inputs.definition }}
        SPEX_ACTION_DEFINITION_FILES: ${{ inputs.definition-files }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/transport.py" prepare
    - id: package
      name: Upload submission envelope
      uses: actions/upload-artifact@v4
      with:
        name: spex-request-${{ steps.prepare.outputs.request-id }}
        path: ${{ steps.prepare.outputs.request-path }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 3
    - id: submit
      if: inputs.execution-mode == 'dispatch'
      name: Submit and await remote acceptance
      shell: bash
      env:
        SPEX_ACTION_REQUEST: ${{ steps.prepare.outputs.request-path }}
        SPEX_ACTION_REQUEST_ID: ${{ steps.prepare.outputs.request-id }}
        SPEX_ACTION_REQUEST_SHA: ${{ steps.prepare.outputs.request-sha256 }}
        SPEX_ACTION_RUNTIME_WORKFLOW: ${{ inputs.runtime-workflow }}
        SPEX_ACTION_WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
        SPEX_ACTION_ARTIFACT_ID: ${{ steps.package.outputs.artifact-id }}
        SPEX_REMOTE_TOKEN: ${{ inputs.remote-token }}
        SPEX_REMOTE_APP_ID: ${{ inputs.app-id }}
        SPEX_REMOTE_APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/transport.py" submit
